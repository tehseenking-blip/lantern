name: Apply verified Colibri implementation
on:
  push:
    branches: [feat/colibri-local-provider]
    paths: [.github/workflows/apply-colibri-patch.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'tehseenking-blip/lantern' && github.ref == 'refs/heads/feat/colibri-local-provider'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact authored patch and allowed file scope
        shell: python
        run: |
          import base64, hashlib, pathlib, re, subprocess, zlib
          parts = [pathlib.Path(f'.github/colibri-patch.{i}') for i in range(4)]
          patch = zlib.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'ce5fd6ed50f8f80f8d7f057ef2c9e5a7f3347c25513ee42cb0f03d00bd71a48e', 'Patch checksum mismatch'
          expected = {'.gitignore','docs/COLIBRI.md','docs/COLIBRI_TESTING.md','electron/db.js','electron/ipc.js','electron/llm.js','electron/preload.js','electron/providers.js','package.json','renderer/src/components/ChatSettings.jsx','renderer/src/components/ColibriHelp.jsx','renderer/src/components/SettingsView.jsx','scripts/check-colibri.cjs','scripts/check-windows-launcher.cjs','scripts/electron-smoke.cjs','scripts/start-colibri.ps1','tests/ipc-providers.test.mjs','tests/llm.test.mjs','tests/providers.test.mjs'}
          names = re.findall(rb'^diff --git a/(.+) b/(.+)$', patch, re.M)
          assert all(a == b for a,b in names)
          assert {a.decode() for a,b in names} == expected, 'Unexpected file scope'
          subprocess.run(['git','apply','--check','-'], input=patch, check=True)
          subprocess.run(['git','apply','-'], input=patch, check=True)
          for part in parts: part.unlink()
      - name: Re-run all authored unit and protocol tests
        run: npm test
      - name: Commit only on the isolated review branch
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitignore docs electron package.json renderer/src/components scripts tests .github/colibri-patch.*
          git commit -m "feat: add Colibri local provider, privacy checks and regression coverage"
          git push origin HEAD:refs/heads/feat/colibri-local-provider
